version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mail_cs_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mail_cs
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: mail_cs_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: mail_cs
      GITHUB_TOKEN: ""
    depends_on:
      - mysql

volumes:
  mysql_data:
